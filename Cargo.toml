[package]
name = "sigmaos-build-system"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "SigmaOS reproducible build system"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
